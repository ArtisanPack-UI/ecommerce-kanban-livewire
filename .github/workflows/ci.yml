name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Lint

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, intl
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-lint-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-lint-composer-

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Run composer lint
        run: composer lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Test (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}, Livewire ${{ matrix.livewire }}, ${{ matrix.dependencies }})

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12', '13']
        livewire: ['3', '4']
        dependencies: ['highest']
        include:
          # The lowest versions composer.json allows, so a raised floor is
          # caught. Listed in full: an added combination gets none of the
          # entries below.
          - php: '8.3'
            laravel: '12'
            livewire: '3'
            dependencies: 'lowest'
            testbench: '^10.2'
            livewire-constraint: '^3.6'
          - laravel: '12'
            testbench: '^10.2'
          - laravel: '13'
            testbench: '^11.0'
          - livewire: '3'
            livewire-constraint: '^3.6'
          - livewire: '4'
            livewire-constraint: '^4.0'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, intl
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-l${{ matrix.laravel }}-lw${{ matrix.livewire }}-${{ matrix.dependencies }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-l${{ matrix.laravel }}-lw${{ matrix.livewire }}-${{ matrix.dependencies }}-composer-

      - name: Install dependencies
        env:
          LARAVEL: ${{ matrix.laravel }}
          TESTBENCH: ${{ matrix.testbench }}
          LIVEWIRE: ${{ matrix.livewire-constraint }}
          DEPENDENCIES: ${{ matrix.dependencies }}
        run: |
          composer require "illuminate/support:^${LARAVEL}.0" "livewire/livewire:${LIVEWIRE}" --no-interaction --no-update
          composer require "orchestra/testbench:${TESTBENCH}" --dev --no-interaction --no-update

          if [ "$DEPENDENCIES" = "lowest" ]; then
            composer update --no-interaction --prefer-dist --with-all-dependencies --prefer-lowest --prefer-stable
          else
            composer update --no-interaction --prefer-dist --with-all-dependencies
          fi

      - name: Run tests
        env:
          XDEBUG_MODE: off
        run: vendor/bin/pest --testsuite=Unit,Feature --no-coverage

  pci-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: PCI Column Lint

    # This package ships no migrations. The job guards against drift if one
    # is ever added.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, intl
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-lint-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-lint-composer-

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Run PCI column lint
        run: vendor/bin/testbench ecommerce:lint:pci-columns --path="$GITHUB_WORKSPACE/database/migrations"

  translation-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Translation Lint

    # Fails on a bare user-facing string in src/ or resources/ (Blade
    # included), or a key missing from any of lang/{en,es,fr,de}.json.
    # `--no-engine` leaves the engine's own sources out of the run.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, intl
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-lint-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-lint-composer-

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Run translation lint
        run: >-
          vendor/bin/testbench ecommerce:lint:translations --no-engine
          --path="$GITHUB_WORKSPACE/src"
          --path="$GITHUB_WORKSPACE/resources"
          --lang="$GITHUB_WORKSPACE/lang"

  browser:
    runs-on: ubuntu-latest
    # A browser step that never resolves can wait indefinitely, so cap it.
    timeout-minutes: 20
    name: Browser (Livewire ${{ matrix.livewire }})

    # The board journeys, keyboard checks, and accessibility checks in
    # tests/Browser, against the workbench asset bundle (Tailwind + daisyUI
    # and livewire-drag-and-drop) on a seeded demo board.
    strategy:
      fail-fast: false
      matrix:
        livewire: ['3', '4']
        include:
          - livewire: '3'
            livewire-constraint: '^3.6'
          - livewire: '4'
            livewire-constraint: '^4.0'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, intl, sockets
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-browser-lw${{ matrix.livewire }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-browser-lw${{ matrix.livewire }}-composer-

      - name: Install PHP dependencies
        env:
          LIVEWIRE: ${{ matrix.livewire-constraint }}
        run: |
          composer require "livewire/livewire:${LIVEWIRE}" --no-interaction --no-update
          composer update --no-interaction --prefer-dist --with-all-dependencies

      - name: Install npm dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build the browser asset bundle
        run: npm run build:browser

      - name: Run browser tests
        # The browser plugin waits without a deadline on an action Playwright
        # never finishes (e.g. clicking a disabled button), so fail early.
        timeout-minutes: 10
        env:
          XDEBUG_MODE: off
        run: vendor/bin/pest --group=browser --no-coverage
